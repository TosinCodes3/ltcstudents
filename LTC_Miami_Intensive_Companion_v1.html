<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<title>The Miami Intensive — Student Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#08080A;
  --ink-2:#0D0D10;
  --ink-3:#141418;
  --bone:#EDEDF0;
  --bone-60:rgba(237,237,240,.62);
  --bone-38:rgba(237,237,240,.40);
  --bone-18:rgba(237,237,240,.18);
  --bone-09:rgba(237,237,240,.09);
  --scrim:rgba(8,8,10,.88);
  --acc:#FFFFFF;
  --acc-60:rgba(255,255,255,.60);
  --acc-24:rgba(255,255,255,.24);
  --glow:rgba(255,255,255,.085);
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --pad:22px;
}
[data-theme="light"]{
  --ink:#F6F6F7;
  --ink-2:#EFEFF1;
  --ink-3:#E6E6E9;
  --bone:#0C0C0E;
  --bone-60:rgba(12,12,14,.66);
  --bone-38:rgba(12,12,14,.44);
  --bone-18:rgba(12,12,14,.20);
  --bone-09:rgba(12,12,14,.11);
  --scrim:rgba(246,246,247,.90);
  --acc:#0C0C0E;
  --acc-60:rgba(12,12,14,.60);
  --acc-24:rgba(12,12,14,.24);
  --glow:rgba(0,0,0,.055);
}
html{transition:background .4s ease}
body,.mast,.sheet,.card,textarea,.fig svg{transition:background-color .4s ease,color .4s ease,border-color .4s ease}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{background:var(--ink)}
body{
  background:var(--ink);
  color:var(--bone);
  font-family:var(--sans);
  font-size:15px;
  font-weight:400;
  line-height:1.6;
  letter-spacing:-.008em;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
/* film grain */
body::before{
  content:"";position:fixed;inset:0;z-index:120;pointer-events:none;opacity:.038;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  background-size:160px 160px;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--acc);outline-offset:3px;border-radius:2px}

/* display type — one family, weight + tracking do the work */
.dsp{font-weight:250;letter-spacing:-.038em;font-optical-sizing:auto}
.lbl{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;font-weight:500}

/* ---------- shell ---------- */
.wrap{max-width:640px;margin:0 auto;min-height:100vh;position:relative}
.wrap::before{
  content:"";position:absolute;top:-220px;left:50%;transform:translateX(-50%);
  width:820px;height:520px;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,var(--glow),transparent 72%);
}

/* ---------- masthead ---------- */
.mast{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px var(--pad) 15px;
  border-bottom:1px solid var(--bone-09);
  position:sticky;top:0;z-index:40;
  background:var(--scrim);
  backdrop-filter:blur(16px) saturate(120%);
}
.mono{
  font-size:15px;letter-spacing:.36em;font-weight:600;
  padding:2px 0 2px 2px;line-height:1;
  background:linear-gradient(96deg,var(--bone) 12%,var(--bone-38) 42%,var(--bone) 62%,var(--bone-38) 92%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmerText 7s linear infinite;
}
@keyframes shimmerText{from{background-position:120% 0}to{background-position:-120% 0}}
.mast-right{display:flex;gap:6px;align-items:center}
.chip{
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  color:var(--bone-60);border:1px solid var(--bone-18);
  padding:7px 11px;border-radius:100px;white-space:nowrap;
}
.chip:active{color:var(--bone);border-color:var(--bone-38)}
.chip.icon{padding:6px 9px;display:flex;align-items:center}
.chip.icon svg{display:block}

/* ---------- hero ---------- */
.hero{padding:44px var(--pad) 30px;border-bottom:1px solid var(--bone-09);position:relative;z-index:1}
.eyebrow{
  font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;
  color:var(--bone-38);margin-bottom:20px;display:flex;align-items:center;gap:11px;
}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--bone-09)}
.hero h1{
  font-weight:250;letter-spacing:-.045em;
  font-size:clamp(44px,13.5vw,66px);line-height:.92;
  margin:0 0 22px;
}
.hero h1 span{color:var(--bone-38)}
.meta{display:flex;flex-wrap:wrap;gap:7px 18px;font-size:11px;color:var(--bone-60);
  letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.meta span{display:flex;align-items:center;gap:8px}
.meta i{width:3px;height:3px;background:var(--bone-38);border-radius:50%;font-style:normal;flex:none}

/* ---------- status + progress rail ---------- */
.status{padding:16px var(--pad) 17px;border-bottom:1px solid var(--bone-09);position:relative;z-index:1}
.statusrow{font-size:12px;letter-spacing:.01em;color:var(--bone-60);display:flex;align-items:center;gap:10px}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--bone);flex:none;
  box-shadow:0 0 0 0 var(--acc-24);animation:pulse 2.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.rail{display:flex;gap:4px;margin-top:13px}
.rail i{flex:1;height:2px;background:var(--bone-09);border-radius:2px;position:relative;overflow:hidden}
.rail i.fill{background:var(--bone-38)}
.rail i.now{background:var(--bone-09)}
.rail i.now::after{content:"";position:absolute;inset:0;background:var(--acc);
  transform:translateX(-100%);animation:railRun 2.6s cubic-bezier(.5,0,.5,1) infinite}
@keyframes railRun{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

/* ---------- day ledger ---------- */
.ledger{padding:6px 0 0;position:relative;z-index:1}
.plate{
  display:block;width:100%;text-align:left;
  padding:24px var(--pad);
  border-bottom:1px solid var(--bone-09);
  position:relative;overflow:hidden;
  font:inherit;color:inherit;background:none;border-left:0;border-right:0;border-top:0;
  cursor:pointer;
}
.plate::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,var(--bone-09),transparent 62%);
  opacity:0;transition:opacity .3s ease;
}
.plate:hover::before{opacity:1}
.plate-top{display:flex;align-items:baseline;gap:15px;margin-bottom:6px}
.num{
  font-size:36px;line-height:.86;font-weight:200;letter-spacing:-.05em;
  color:var(--bone-18);flex:none;min-width:50px;font-variant-numeric:tabular-nums;
}
.plate.open .num,.plate.today .num{color:var(--bone-38)}
.plate.today .num{color:var(--bone)}
.plate-body{flex:1;min-width:0}
.dayname{
  font-size:25px;line-height:1.1;font-weight:300;letter-spacing:-.035em;
  margin:0 0 6px;color:var(--bone-38);
}
.plate.open .dayname,.plate.done .dayname{color:var(--bone)}
.daydate{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-38);font-weight:500}
.plate-foot{
  display:flex;align-items:center;gap:10px;margin-top:15px;padding-left:65px;
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-38);font-weight:500;
}
.plate.open .plate-foot{color:var(--bone-60)}
.cut{flex:1;height:1px;background:var(--bone-09);position:relative}
.plate.open .cut::after{content:"";position:absolute;left:0;top:0;height:1px;width:34px;background:var(--bone-38)}
.seal{display:flex;align-items:center;gap:7px}
.seal svg{opacity:.5}
.today-tag{
  display:inline-block;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);background:var(--bone);padding:3px 8px;border-radius:2px;
  margin-left:10px;vertical-align:middle;font-weight:600;
}

/* ============================================================
   CERTIFICATE — the object at the end of the week
   ============================================================ */
.certblock{padding:52px var(--pad) 40px;border-top:1px solid var(--bone-09);position:relative;z-index:1}
.certblock .eyebrow{margin-bottom:14px}
.certblock h2{font-size:clamp(30px,9vw,42px);font-weight:250;letter-spacing:-.045em;
  line-height:.98;margin:0 0 6px}
.certblock h2 span{color:var(--bone-38)}
.certblock .sub{font-size:13px;color:var(--bone-60);line-height:1.62;margin:14px 0 0;max-width:44ch}

.cert-stage{
  container-type:inline-size;
  perspective:1500px;perspective-origin:50% 42%;
  padding:38px 0 8px;cursor:pointer;
}
.cert-rotor{
  position:relative;transform-style:preserve-3d;
  animation:certTurn 15s cubic-bezier(.45,0,.55,1) infinite;
  will-change:transform;
}
.cert-rotor.hold{animation:none;transform:rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));
  transition:transform .16s ease-out}
@keyframes certTurn{
  0%{transform:rotateY(-21deg) rotateX(7deg)}
  50%{transform:rotateY(21deg) rotateX(-3deg)}
  100%{transform:rotateY(-21deg) rotateX(7deg)}
}
.cert-face{position:relative;transition:opacity .9s ease,filter .9s ease}
.cert-face.lit{
  position:absolute;inset:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(102deg,transparent 39%,#000 46.5%,#000 52%,transparent 60%);
          mask-image:linear-gradient(102deg,transparent 39%,#000 46.5%,#000 52%,transparent 60%);
  -webkit-mask-size:280% 100%;mask-size:280% 100%;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  animation:certSweep 6.4s cubic-bezier(.6,0,.4,1) infinite;
  filter:brightness(1.75) contrast(1.04);
}
@keyframes certSweep{
  0%{-webkit-mask-position:100% 0;mask-position:100% 0}
  62%,100%{-webkit-mask-position:0% 0;mask-position:0% 0}
}
.cert-glare{
  position:absolute;inset:-2%;pointer-events:none;border-radius:6px;
  background:linear-gradient(102deg,transparent 42%,rgba(255,255,255,.30) 49%,rgba(255,255,255,.06) 53%,transparent 60%);
  background-size:280% 100%;mix-blend-mode:screen;
  animation:glareSweep 6.4s cubic-bezier(.6,0,.4,1) infinite;
}
@keyframes glareSweep{
  0%{background-position:100% 0}
  62%,100%{background-position:0% 0}
}
.cert-shadow{
  height:26px;margin:6px 8% 0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.75),transparent 72%);
  filter:blur(7px);opacity:.85;
}
[data-theme="light"] .cert-shadow{background:radial-gradient(closest-side,rgba(0,0,0,.32),transparent 72%)}

/* sealed vs revealed */
.cert-stage .cert-face:not(.lit){opacity:.10;filter:saturate(0) brightness(.85)}
.cert-stage.on .cert-face:not(.lit){opacity:1;filter:none}
.cert-stage.on .cert-face.lit{filter:brightness(1.5);opacity:.85}

/* the card itself */
.cert{
  position:relative;width:100%;aspect-ratio:1.44/1;border-radius:5px;overflow:hidden;
  font-size:13px;font-size:clamp(8.5px,2.72cqi,17px);
  background:
    radial-gradient(130% 90% at 18% -10%,rgba(255,255,255,.13),transparent 58%),
    radial-gradient(120% 120% at 100% 120%,rgba(255,255,255,.07),transparent 55%),
    linear-gradient(158deg,#17171B 0%,#08080A 52%,#131317 100%);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 44px 70px -34px rgba(0,0,0,.95),0 2px 0 rgba(255,255,255,.05) inset;
  color:#EDEDF0;
  padding:1.9em 2.1em 1.7em;
  display:flex;flex-direction:column;justify-content:space-between;
}
.cert-frame{position:absolute;inset:.75em;border:1px solid rgba(255,255,255,.12);border-radius:2px;pointer-events:none}
.cert-frame::before,.cert-frame::after{
  content:"";position:absolute;width:1.1em;height:1.1em;border:1px solid rgba(255,255,255,.30)}
.cert-frame::before{top:-.28em;left:-.28em;border-right:0;border-bottom:0}
.cert-frame::after{bottom:-.28em;right:-.28em;border-left:0;border-top:0}
.cert-grid{
  position:absolute;inset:0;pointer-events:none;opacity:.85;
  background-image:
    repeating-linear-gradient(118deg,rgba(255,255,255,.05) 0 1px,transparent 1px 6px),
    repeating-radial-gradient(circle at 84% 128%,rgba(255,255,255,.055) 0 1px,transparent 1px 9px);
  -webkit-mask-image:radial-gradient(125% 105% at 46% -8%,#000 26%,transparent 82%);
          mask-image:radial-gradient(125% 105% at 46% -8%,#000 26%,transparent 82%);
}
.cert-top,.cert-bot{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:2}
.cert-top{align-items:center}
.cert-mark{font-size:.86em;letter-spacing:.42em;font-weight:600;
  background:linear-gradient(100deg,#fff 10%,#8B8B93 45%,#fff 70%,#7E7E86 95%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.cert-ser{font-size:.62em;letter-spacing:.24em;text-transform:uppercase;color:rgba(237,237,240,.42);font-weight:500}
.cert-mid{position:relative;z-index:2;text-align:center;padding:.2em 0 .1em}
.cert-kicker{font-size:.6em;letter-spacing:.36em;text-transform:uppercase;color:rgba(237,237,240,.46);
  font-weight:500;margin-bottom:1.05em}
.cert-name{
  font-size:2.5em;line-height:1;font-weight:250;letter-spacing:-.035em;
  background:linear-gradient(96deg,#fff 8%,#9A9AA2 38%,#fff 58%,#8E8E96 88%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  animation:shimmerText 9s linear infinite;
}
.cert-name.blank{color:rgba(237,237,240,.24);background:none;-webkit-text-fill-color:currentColor;
  font-weight:200;animation:none;border-bottom:1px dashed rgba(255,255,255,.18);
  display:inline-block;padding:0 .35em .06em}
.cert-rule{height:1px;margin:.95em auto .8em;width:38%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent)}
.cert-course{font-size:.86em;font-weight:400;letter-spacing:-.01em;color:rgba(237,237,240,.9)}
.cert-sub{font-size:.58em;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,237,240,.38);
  margin-top:.7em;font-weight:500}
.cert-col{display:flex;flex-direction:column;gap:.3em;min-width:0}
.cert-col.r{text-align:right}
.cert-sigline{font-size:.82em;font-weight:300;letter-spacing:.02em;color:rgba(237,237,240,.88);
  padding-bottom:.32em;border-bottom:1px solid rgba(255,255,255,.16)}
.cert-sigcap{font-size:.52em;letter-spacing:.2em;text-transform:uppercase;color:rgba(237,237,240,.34);font-weight:500}
.cert-seal{width:4.6em;flex:none;margin:0 .6em;opacity:.92}
.cert-seal svg{display:block;width:100%;height:auto}

.cert-caption{
  display:flex;align-items:center;gap:10px;margin-top:22px;
  font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-38);font-weight:500;
}
.cert-caption b{color:var(--bone-60);font-weight:500}
.cert-caption .dot{width:4px;height:4px;border-radius:50%;background:var(--bone-38);flex:none}

.namefield{display:block;margin-top:26px}
.namefield span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--bone-38);margin-bottom:9px;font-weight:500}
.namefield input{
  width:100%;background:var(--ink-2);border:1px solid var(--bone-09);border-radius:3px;
  padding:14px 16px;font-size:15px;font-weight:300;letter-spacing:-.02em;color:var(--bone);
}
.namefield input::placeholder{color:var(--bone-38)}
.namefield input:focus{outline:none;border-color:var(--bone-18)}

.sitefoot{
  padding:34px var(--pad) 46px;border-top:1px solid var(--bone-09);
  display:flex;justify-content:space-between;gap:14px;position:relative;z-index:1;
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--bone-38);font-weight:500;
}

/* ---------- day detail ---------- */
.sheet{
  position:fixed;inset:0;z-index:60;background:var(--ink);
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .34s cubic-bezier(.3,.7,.25,1);
  visibility:hidden;
}
.sheet.up{transform:translateY(0);visibility:visible}
.sheet-inner{max-width:640px;margin:0 auto;padding-bottom:70px}
.sheet-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px var(--pad);border-bottom:1px solid var(--bone-09);
  position:sticky;top:0;background:var(--scrim);backdrop-filter:blur(16px);z-index:5;
}
.back{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-60);
  display:flex;align-items:center;gap:9px;font-weight:500}
.sheet-day{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-38);font-weight:500}

.sheet-head{padding:36px var(--pad) 26px;border-bottom:1px solid var(--bone-09)}
.sheet-head h2{font-weight:250;font-size:clamp(34px,10.5vw,50px);letter-spacing:-.045em;
  line-height:.98;margin:0 0 14px}
.sheet-head .daydate{font-size:10px}

/* tabs */
.tabs{
  display:flex;gap:0;border-bottom:1px solid var(--bone-09);
  position:sticky;top:53px;background:var(--scrim);backdrop-filter:blur(16px);z-index:4;
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:15px 11px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  color:var(--bone-38);white-space:nowrap;flex:none;position:relative;
}
.tab.on{color:var(--bone)}

.pane{display:none;padding:32px var(--pad) 46px;animation:fade .3s ease}
.pane.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* schedule */
.slot{display:flex;gap:17px;padding:16px 0;border-bottom:1px solid var(--bone-09)}
.slot:last-child{border-bottom:0}
.slot-time{
  font-size:10.5px;letter-spacing:.1em;color:var(--bone-38);flex:none;width:58px;padding-top:5px;
  font-variant-numeric:tabular-nums;font-weight:500;text-transform:uppercase;
}
.slot-name{font-size:20px;line-height:1.22;margin:0 0 4px;font-weight:300;letter-spacing:-.03em}
.slot-note{font-size:12.5px;color:var(--bone-60);line-height:1.55}
.slot.break .slot-name{color:var(--bone-38);font-size:17px;font-weight:200}

/* generic blocks */
.lede{font-size:21px;line-height:1.42;font-weight:250;letter-spacing:-.03em;
  color:var(--bone-60);margin:0 0 30px}
.lede em{font-style:normal;color:var(--bone)}
.h3{font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--bone-38);font-weight:500;
  margin:38px 0 16px;padding-bottom:10px;border-bottom:1px solid var(--bone-09)}
.h3:first-child{margin-top:0}

.card{border:1px solid var(--bone-09);border-radius:4px;padding:22px;margin-bottom:14px;
  background:linear-gradient(170deg,var(--ink-3),var(--ink-2))}
.card h4{font-size:22px;font-weight:300;letter-spacing:-.035em;margin:0 0 10px;line-height:1.14}
.card p{margin:0 0 10px;font-size:13.5px;color:var(--bone-60);line-height:1.62}
.card p:last-child{margin-bottom:0}
.tagline{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-38);
  margin-bottom:10px;font-weight:500}

ul.list{margin:0;padding:0;list-style:none}
ul.list li{position:relative;padding:0 0 12px 20px;font-size:13.5px;color:var(--bone-60);line-height:1.6}
ul.list li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:1px;background:var(--bone-38)}
ul.list li b{color:var(--bone);font-weight:500}

.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 20px 46px;font-size:13.5px;color:var(--bone-60)}
.steps li::before{
  content:counter(s,decimal-leading-zero);position:absolute;left:0;top:-1px;
  font-size:17px;font-weight:200;color:var(--bone-38);font-variant-numeric:tabular-nums;
}
.steps li b{display:block;color:var(--bone);font-size:19px;font-weight:300;letter-spacing:-.03em;
  margin-bottom:4px;line-height:1.2}

.pull{
  border-left:1px solid var(--bone-18);padding:2px 0 2px 19px;margin:28px 0;
  font-size:21px;line-height:1.36;font-weight:250;letter-spacing:-.03em;
}

/* diagrams */
.fig{margin:0 0 28px}
.fig svg{width:100%;height:auto;display:block;border:1px solid var(--bone-09);border-radius:4px;
  background:linear-gradient(170deg,var(--ink-3),var(--ink-2))}
.cap{font-size:11px;color:var(--bone-38);margin-top:10px;letter-spacing:0}

/* notes */
.notewrap{position:relative}
textarea{
  width:100%;min-height:290px;background:var(--ink-2);color:var(--bone);
  border:1px solid var(--bone-09);border-radius:4px;padding:18px;
  font-family:var(--sans);font-size:14.5px;font-weight:300;line-height:1.72;resize:vertical;
  background-image:repeating-linear-gradient(transparent,transparent 24.9px,var(--bone-09) 24.9px,var(--bone-09) 25px);
  background-attachment:local;
}
textarea::placeholder{color:var(--bone-38)}
textarea:focus{outline:none;border-color:var(--bone-18)}
.saved{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--bone-38);font-weight:500;
  margin-top:12px;display:flex;align-items:center;gap:8px;height:14px}
.saved.flash{color:var(--bone)}

/* prompts */
.prompt{border:1px dashed var(--bone-18);border-radius:4px;padding:15px 17px;margin-bottom:11px;
  font-size:17px;line-height:1.38;color:var(--bone-60);font-weight:300;letter-spacing:-.025em}

/* buttons */
.btn{
  display:block;width:100%;text-align:center;padding:16px;
  border:1px solid var(--bone-18);color:var(--bone);border-radius:3px;
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:11px;font-weight:500;
}
.btn:active{background:var(--bone-09)}
.btn.solid{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600}
.btn.solid:active{opacity:.85}
.btn.ghost{border-color:var(--bone-09);color:var(--bone-38)}

/* locked pane */
.emptystate{text-align:center;padding:72px 10px}
.emptystate svg{opacity:.28;margin-bottom:22px}
.emptystate h4{font-size:25px;font-weight:250;letter-spacing:-.035em;margin:0 0 10px}
.emptystate p{font-size:13px;color:var(--bone-38);max-width:280px;margin:0 auto;line-height:1.6}

/* logistics + export */
.info-row{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--bone-09)}
.info-row:last-child{border-bottom:0}
.info-k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--bone-38);font-weight:500;
  flex:none;width:78px;padding-top:5px}
.info-v{font-size:14px;line-height:1.55;font-weight:300}
.info-v small{display:block;font-size:12px;color:var(--bone-60);margin-top:4px}

.swatches{display:flex;gap:9px;margin-top:12px}
.sw{flex:1;height:52px;border-radius:2px;border:1px solid var(--bone-18);position:relative}
.sw span{position:absolute;bottom:-19px;left:0;font-size:8.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--bone-38);font-weight:500}

.footnote{font-size:11.5px;color:var(--bone-38);line-height:1.65;margin-top:32px;
  padding-top:20px;border-top:1px solid var(--bone-09)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes riseSm{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes wipe{from{width:0}to{width:34px}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}

.enter{opacity:0;animation:rise .78s cubic-bezier(.16,.72,.24,1) forwards;animation-delay:var(--d,0ms)}
.enter-sm{opacity:0;animation:riseSm .55s cubic-bezier(.16,.72,.24,1) forwards;animation-delay:var(--d,0ms)}

.plate{opacity:0;animation:rise .62s cubic-bezier(.16,.72,.24,1) forwards;animation-delay:calc(var(--i,0)*72ms + 120ms)}
.plate:active{transform:scale(.988)}
.plate{transition:background .22s ease,transform .18s ease}
.plate.open .cut::after{animation:wipe .9s cubic-bezier(.16,.72,.24,1) forwards;animation-delay:calc(var(--i,0)*72ms + 420ms)}

.fig svg [stroke]:not([stroke-dasharray]){stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.15s cubic-bezier(.3,.7,.3,1) forwards;animation-delay:var(--dd,120ms)}
.fig svg [stroke-dasharray]{opacity:0;animation:riseSm .6s ease forwards;animation-delay:calc(var(--dd,120ms) + 700ms)}
.fig svg text{opacity:0;animation:riseSm .5s ease forwards;animation-delay:calc(var(--dd,120ms) + 520ms)}

.tab{transition:color .25s ease}
.tab::after{content:"";position:absolute;left:11px;right:11px;bottom:-1px;height:1px;background:var(--bone);
  transform:scaleX(0);transform-origin:left;transition:transform .34s cubic-bezier(.16,.72,.24,1)}
.tab.on::after{transform:scaleX(1)}

.chip{transition:color .2s ease,border-color .2s ease,transform .18s ease}
.chip:active{transform:scale(.94)}
.btn{transition:background .22s ease,color .22s ease,transform .16s ease,opacity .2s ease}
.btn:active{transform:scale(.985)}
.mono{transition:transform .18s ease}
.mono:active{transform:scale(.92)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-delay:0ms !important;
    transition-duration:.01ms !important;animation-iteration-count:1 !important}
  .enter,.enter-sm,.plate,.fig svg text{opacity:1}
  .fig svg [stroke]{stroke-dashoffset:0}
  .fig svg [stroke-dasharray]{opacity:1}
  .plate.open .cut::after{width:34px}
  .cert-rotor{transform:rotateY(-8deg) rotateX(3deg)}
  .cert-stage .cert-face:not(.lit){opacity:.34;filter:none}
  .cert-face.lit,.cert-glare{display:none}
  .mono,.cert-name{-webkit-text-fill-color:currentColor;color:var(--bone);background:none}
}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  background:var(--bone);color:var(--ink);padding:12px 20px;border-radius:3px;
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  opacity:0;pointer-events:none;transition:all .28s ease;z-index:99;
}
.toast.up{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   STORAGE — works hosted (localStorage), inside Claude
   (window.storage), and falls back to memory if both fail.
   ============================================================ */
const Store = (() => {
  const mem = {};
  const hasWS = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  let ls = null;
  try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ls = localStorage; } catch(e){}
  return {
    async get(k){
      if (hasWS){ try { const r = await window.storage.get(k); return r ? r.value : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } }
      if (ls){ try { return ls.getItem(k); } catch(e){} }
      return mem[k] ?? null;
    },
    async set(k,v){
      mem[k] = v;
      if (hasWS){ try { await window.storage.set(k,v); return; } catch(e){} }
      if (ls){ try { ls.setItem(k,v); } catch(e){} }
    }
  };
})();

/* BUILD MODE — every day unlocked while Tosin is still building.
   Set to false before this goes to students, or tap the LTC monogram 5x. */
const BUILD_UNLOCK = true;
let override = BUILD_UNLOCK;
let current = null;
let saveTimer = null;

function today(){ return new Date(); }
function dayIndexNow(){
  const now = today();
  if (now.getFullYear() !== YEAR) return now.getFullYear() > YEAR ? 5 : 0;
  if (now.getMonth() < MONTH) return 0;
  if (now.getMonth() > MONTH) return 5;
  const d = now.getDate();
  if (d < START_DAY) return 0;
  return Math.min(5, d - START_DAY + 1);
}
function stateFor(n){
  if (override) return 'done';
  const cur = dayIndexNow();
  if (n < cur) return 'done';
  if (n === cur) return 'today';
  return 'locked';
}
function recapReady(n){
  if (override) return true;
  const cur = dayIndexNow();
  if (n < cur) return true;
  if (n === cur) return today().getHours() >= RECAP_HOUR;
  return false;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function certEarned(){
  const now = today();
  if (now.getFullYear() > YEAR) return true;
  if (now.getFullYear() < YEAR) return false;
  if (now.getMonth() > MONTH) return true;
  if (now.getMonth() < MONTH) return false;
  const d = now.getDate();
  if (d > START_DAY + 4) return true;
  return d === START_DAY + 4 && now.getHours() >= 16;
}

function paintCert(){
  document.getElementById('certBase').innerHTML = certMarkup(certName,'a');

/* tilt on pointer — the card follows your finger, then goes back to its own turn */
let holdTimer = null;
certStage.addEventListener('pointermove', e => {
  const r = certStage.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width  - .5;
  const y = (e.clientY - r.top)  / r.height - .5;
  certRotor.style.setProperty('--ry', (x * 30).toFixed(2) + 'deg');
  certRotor.style.setProperty('--rx', (-y * 18).toFixed(2) + 'deg');
  certRotor.classList.add('hold');
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => certRotor.classList.remove('hold'), 2200);
});
certStage.addEventListener('pointerleave', () => {
  clearTimeout(holdTimer);
  certRotor.classList.remove('hold');
});

/* ============================================================
   MOTION — measure svg paths so they draw themselves in
   ============================================================ */
function primeFigures(scope){
  scope.querySelectorAll('.fig svg').forEach((svg, fi) => {
    svg.querySelectorAll('path,circle,ellipse,rect,line').forEach((el, i) => {
      let len = 0;
      try { len = el.getTotalLength ? el.getTotalLength() : 0; } catch(e){}
      if (!len || !isFinite(len)) len = 400;
      el.style.setProperty('--len', Math.ceil(len));
      el.style.setProperty('--dd', (fi * 90 + i * 55 + 100) + 'ms');
    });
  });
}
function primePane(pane){
  if (!pane || pane.dataset.primed) return;
  pane.dataset.primed = '1';
  primeFigures(pane);
  stagger(pane, '.lede, .slot, .card, .h3, .fig, ul.list, .steps, .pull, .info-row, .btn, .swatches, .footnote, .emptystate', 58, 60);
}
function stagger(scope, sel, step, start){
  scope.querySelectorAll(sel).forEach((el, i) => {
    el.classList.add('enter');
    el.style.setProperty('--d', (start + i * step) + 'ms');
  });
}

document.getElementById('btnInfo').addEventListener('click', openInfo);
